<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>

      <!-- Tela de carregamento com a marca. Fica por cima do canvas ate o jogo
           estar pronto, e some sozinha. -->
      <div id="suricatus-loading">
        <img id="suricatus-logo" src="TemplateData/logo.png" alt="Suricatus Games">
        <p id="suricatus-texto">Carregando o jogo…</p>
        <div id="suricatus-barra"><div id="suricatus-barra-cheia"></div></div>
        <p id="suricatus-porcento">0%</p>
        <p id="suricatus-erro"></p>
      </div>

      <div id="unity-warning"> </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var telaCarregando = document.querySelector("#suricatus-loading");
      var barraCheia = document.querySelector("#suricatus-barra-cheia");
      var textoPorcento = document.querySelector("#suricatus-porcento");
      var textoCarregando = document.querySelector("#suricatus-texto");
      var textoErro = document.querySelector("#suricatus-erro");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // --- Teclado do celular ---------------------------------------------
      // Em iOS/Android o teclado nao encolhe a janela: ele cobre a pagina.
      // O visualViewport, sim, reflete a area que continua visivel. Ao casar
      // o container com ele, o Unity recalcula o layout e os campos do
      // formulario sobem para cima do teclado em vez de ficarem escondidos.
      function fitToVisualViewport() {
        var vv = window.visualViewport;
        if (!vv) return;
        container.style.height = vv.height + "px";
        container.style.top = vv.offsetTop + "px";
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", fitToVisualViewport);
        window.visualViewport.addEventListener("scroll", fitToVisualViewport);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      function mostrarErro(mensagem) {
        textoCarregando.textContent = "Não foi possível carregar o jogo.";
        textoErro.textContent = mensagem;
        barraCheia.style.width = "0%";
        textoPorcento.textContent = "";
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var porcento = Math.round(progress * 100);
          barraCheia.style.width = porcento + "%";
          textoPorcento.textContent = porcento + "%";
        }).then(function (unityInstance) {
          // Esconde depois do fade, senao a tela volta a receber os toques.
          telaCarregando.classList.add("pronto");
          setTimeout(function () { telaCarregando.style.display = "none"; }, 400);
          fitToVisualViewport();
        }).catch(function (message) {
          // Antes isto era um alert(), que no celular do cliente aparece como
          // um aviso do navegador, sem contexto nenhum.
          mostrarErro(message);
        });
      };
      script.onerror = function () {
        mostrarErro("Verifique sua conexão e tente abrir a página de novo.");
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
